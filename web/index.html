<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Faiyke assistant</title>
  <style>
    /* Palette from the shop's own catalogue: ink-violet is "natural black 1B", honey is "613 blonde". The five strand
       colours are the five service lines; they appear in the mark, the starter questions and the source labels. */
    :root {
      --ink: #161513;
      --ink-2: #4d4a45;
      --ink-3: #6c6479;
      --bg: #f1efea;
      --surface: #fbfaf8;
      --surface-2: #e9e6e0;
      --line: #dcd8d0;
      --bubble: #1b1624;
      --bubble-ink: #ffffff;
      --accent: #ff6b1a;
      --accent-ink: #ffffff;
      --link: #5a3b96;
      --focus: #5a3b96;
      --danger: #b3261e;
      --shadow: 0 1px 2px rgba(27, 22, 36, .06), 0 10px 30px rgba(27, 22, 36, .08);
      --hair: #c2506e;
      --ai: #5b6ad6;
      --web: #0f8a94;
      --it: #c27a14;
      --crm: #4f8a35;
      --general: #6c6479;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --side: 280px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #efeaf6;
        --ink-2: #bdb5ca;
        --ink-3: #978fa6;
        --bg: #100d16;
        --surface: #17131f;
        --surface-2: #1d1827;
        --line: #2b2537;
        --bubble: #3a2f52;
        --bubble-ink: #f6f2fb;
        --accent: #ff7a2e;
        --accent-ink: #1b1624;
        --link: #b9a0f2;
        --focus: #b9a0f2;
        --danger: #f2877f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
        --hair: #e58aa4;
        --ai: #94a1fb;
        --web: #43c0ca;
        --it: #e8ab55;
        --crm: #8fca70;
        --general: #978fa6;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font: 16px/1.55 var(--sans); color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }

    .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: 100dvh; }

    /* ---------- the mark: five strands ---------- */
    .mark { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
    .mark svg, .loader svg { width: 100%; height: 100%; overflow: visible; }
    .st { fill: none; stroke-width: 2.7; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
    .st:nth-child(1) { stroke: var(--hair); }
    .st:nth-child(2) { stroke: var(--ai); }
    .st:nth-child(3) { stroke: var(--web); }
    .st:nth-child(4) { stroke: var(--it); }
    .st:nth-child(5) { stroke: var(--crm); }
    .loader { width: 26px; height: 26px; flex: none; }
    .loader .st { animation: sway 1.5s ease-in-out infinite; }
    .loader .st:nth-child(2) { animation-delay: .12s; }
    .loader .st:nth-child(3) { animation-delay: .24s; }
    .loader .st:nth-child(4) { animation-delay: .36s; }
    .loader .st:nth-child(5) { animation-delay: .48s; }
    @keyframes sway { 0%, 100% { transform: translateY(1.6px) scaleY(.88); } 50% { transform: translateY(-1.6px) scaleY(1.06); } }
    .hero-mark { width: 46px; height: 46px; margin-bottom: 18px; }
    .hero-mark .st { stroke-dasharray: 36; animation: draw 1.1s ease-out backwards; }
    .hero-mark .st:nth-child(2) { animation-delay: .1s; }
    .hero-mark .st:nth-child(3) { animation-delay: .2s; }
    .hero-mark .st:nth-child(4) { animation-delay: .3s; }
    .hero-mark .st:nth-child(5) { animation-delay: .4s; }
    @keyframes draw { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }

    /* ---------- sidebar ---------- */
    .side {
      display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line);
      padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 650; font-size: 17px; letter-spacing: .005em; }
    .new {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-weight: 600; text-align: left;
    }
    .new:hover { border-color: var(--ink-3); }
    .new svg { flex: none; }
    .hist { flex: 1; min-height: 0; overflow-y: auto; margin: 14px -4px 8px; padding: 0 4px; }
    .hist-h { margin: 0 8px 6px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
    .hist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .item { display: flex; align-items: center; border-radius: 10px; position: relative; }
    .item:hover, .item[aria-current="true"] { background: var(--surface-2); }
    .item[aria-current="true"] { box-shadow: inset 3px 0 0 var(--accent); }
    .item > button.open {
      flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 9px 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px;
    }
    .item .del {
      border: 0; background: none; color: var(--ink-3); width: 30px; height: 30px; margin-right: 4px;
      border-radius: 8px; display: grid; place-items: center; opacity: 0;
    }
    .item:hover .del, .item:focus-within .del { opacity: 1; }
    .item .del:hover { color: var(--danger); background: var(--surface); }
    @media (hover: none) { .item .del { opacity: .7; } }
    .none { margin: 0 8px; font-size: 14px; color: var(--ink-3); }
    .wipe {
      margin: 10px 4px 0; padding: 7px 10px; border: 0; background: none; border-radius: 10px;
      font-size: 13.5px; color: var(--ink-3); text-align: left; text-decoration: underline; text-underline-offset: 2px;
    }
    .wipe:hover { color: var(--danger); }
    .wipe.sure { color: var(--danger); font-weight: 600; text-decoration: none; background: var(--surface-2); }
    .consent {
      margin: 0 0 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); box-shadow: var(--shadow); font-size: 14px; line-height: 1.5;
    }
    .consent p { margin: 0 0 10px; color: var(--ink-2); }
    .consent-btns { display: flex; gap: 8px; }
    .consent-btns button { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
    .consent-btns button.plain { background: none; color: var(--ink-2); border: 1px solid var(--line); }
    .reach { border-top: 1px solid var(--line); padding: 12px 8px 0; font-size: 13.5px; color: var(--ink-2); }
    .reach b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
    .reach a { color: inherit; text-underline-offset: 2px; }
    .reach p { margin: 0 0 6px; }

    /* ---------- main ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 56px; }
    .top h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { border: 0; background: none; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
    .icon-btn:hover { background: var(--surface); color: var(--ink); }
    .menu { display: none; }
    .human {
      display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink);
    }
    .human:hover:not(:disabled) { border-color: var(--ink-3); }
    .human:disabled { opacity: .5; cursor: default; }
    .human svg { flex: none; }
    .lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .lang button { border: 0; background: none; padding: 6px 11px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); }
    .lang button[aria-pressed="true"] { background: var(--bubble); color: var(--bubble-ink); }
    .speak {
      border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center; color: var(--ink-3);
    }
    .speak:hover { color: var(--ink); }
    .speak[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    .scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .col { width: min(100% - 32px, 720px); margin: 0 auto; }

    /* empty state */
    .empty { padding: clamp(24px, 8vh, 88px) 0 24px; }
    .empty h2 { margin: 0 0 10px; font: 400 clamp(32px, 5.4vw, 46px)/1.1 var(--serif); letter-spacing: -.012em; }
    .empty > p { margin: 0 0 28px; color: var(--ink-2); max-width: 52ch; }
    .starts { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .start {
      --c: var(--ink-3);
      display: grid; grid-template-columns: 10px 1fr; gap: 14px; width: 100%; align-items: stretch;
      text-align: left; border: 0; background: none; padding: 10px 12px 10px 6px; border-radius: 12px;
    }
    .start .strand { width: 10px; height: 100%; min-height: 40px; color: var(--c); opacity: .9; }
    .start .strand path { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .start:hover { background: var(--surface); }
    .start:hover .strand { opacity: 1; }
    .start strong { display: block; font-weight: 600; }
    .start span { display: block; color: var(--ink-2); font-size: 14.5px; }

    /* messages */
    .thread { padding: 8px 0 28px; display: grid; gap: 26px; }
    .msg { display: grid; gap: 6px; animation: rise .22s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
    .me { justify-self: end; max-width: min(85%, 560px); }
    .me .body {
      background: var(--bubble); color: var(--bubble-ink); padding: 10px 15px; border-radius: 20px 20px 6px 20px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .bot { grid-template-columns: 30px minmax(0, 1fr); column-gap: 14px; align-items: start; }
    .bot .mark { margin-top: -1px; }
    .bot .body { overflow-wrap: anywhere; line-height: 1.65; min-width: 0; }
    .body p { margin: 0 0 .85em; }
    .body > :last-child { margin-bottom: 0; }
    .body ul, .body ol { margin: 0 0 .85em; padding-left: 1.3em; }
    .body li { margin: .2em 0; }
    .body a { color: var(--link); text-underline-offset: 2px; }
    .body code { font: .9em ui-monospace, Consolas, monospace; background: var(--surface); border: 1px solid var(--line); padding: .05em .35em; border-radius: 6px; }

    /* what the assistant is doing while it works */
    .work { display: flex; align-items: center; gap: 10px; min-height: 30px; color: var(--ink-2); font-size: 14.5px; }
    .work .loader { margin-left: -2px; }

    /* which parts of our information the answer used */
    .sources { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-3); }
    .sources .lead { margin-right: 2px; }
    .src { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); line-height: 1.4; }
    .src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--general)); flex: none; }

    /* "not sure": its own state, with a way forward */
    .unsure {
      grid-column: 2; margin: 12px 0 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--accent);
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14.5px; color: var(--ink-2);
    }
    .unsure p { margin: 0; max-width: 46ch; }

    .tools { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px; margin-left: -8px; margin-top: 2px; }
    .tools button {
      border: 0; background: none; color: var(--ink-3); font-size: 13px; padding: 4px 8px; border-radius: 8px;
      display: inline-flex; gap: 6px; align-items: center;
    }
    .tools button:hover { background: var(--surface); color: var(--ink); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 14.5px;
      background: var(--accent); color: var(--accent-ink); text-decoration: none; border: 0;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn.quiet { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
    .btn.quiet:hover { border-color: var(--ink-3); filter: none; }
    .cta { display: inline-block; margin-top: 4px; padding: 9px 16px; border-radius: 999px; font-weight: 600; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-size: 14.5px; }
    .cta:hover { filter: brightness(1.06); }
    .reach .cta { display: block; text-align: center; margin-top: 10px; }
    .bot > .cta { grid-column: 2; justify-self: start; margin: 8px 0 2px; }
    .chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
      padding: 7px 14px; font-size: 14px; line-height: 1.35; text-align: left;
    }
    .chip:hover { border-color: var(--link); color: var(--link); }
    .tools .rate { padding: 4px 7px; }
    .tools .rate[aria-pressed="true"] { color: var(--ink); background: var(--surface); }
    .tools .thanks { align-self: center; margin-left: 6px; font-size: 13px; color: var(--ink-3); }
    .why { grid-column: 2; margin-top: 8px; display: grid; gap: 8px; max-width: 620px; }
    .why .reasons { display: flex; flex-wrap: wrap; gap: 6px; }
    .why .reasons .chip { padding: 5px 12px; font-size: 13.5px; }
    .why form { display: flex; gap: 6px; }
    .why input {
      flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); font: inherit; font-size: 14px; color: inherit;
    }
    .why input:focus { outline: 0; border-color: var(--focus); }
    .why form button { border: 0; border-radius: 12px; padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .err .body { color: var(--danger); }

    /* jump to the newest text when the reader has scrolled up during a long answer */
    .jump {
      position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 5;
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-size: 13.5px; font-weight: 600;
    }

    /* composer */
    .dock { padding: 6px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .box {
      display: flex; align-items: flex-end; gap: 8px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 24px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow);
    }
    .box:focus-within { border-color: var(--focus); }
    .box textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; max-height: 200px; padding: 8px 0; line-height: 1.5; min-width: 0; }
    .box textarea::placeholder { color: var(--ink-3); }
    .send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
    .send:disabled { background: var(--line); color: var(--ink-3); cursor: default; }
    .mic { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--ink-2); display: grid; place-items: center; position: relative; }
    .mic:hover { background: var(--surface-2); color: var(--ink); }
    .mic[aria-pressed="true"] { background: var(--danger); color: #fff; }
    .mic[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--danger); animation: ring 1.4s infinite ease-out; }
    @keyframes ring { from { opacity: .7; transform: scale(.9); } to { opacity: 0; transform: scale(1.3); } }
    .foot { margin: 10px 8px 0; text-align: center; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
    .foot a { color: inherit; text-underline-offset: 2px; }
    .count { color: var(--danger); font-weight: 600; }

    .scrim { display: none; }

    @media (max-width: 860px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .side {
        position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 20;
        transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow);
      }
      .app.open .side { transform: none; }
      .app.open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 10; }
      .menu { display: grid; }
    }
    @media (max-width: 600px) {
      .human { width: 38px; padding: 0; justify-content: center; }
      .human .label { display: none; }
      .jump { bottom: 118px; }
      .chips { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    .cookie { position: fixed; left: 16px; bottom: 16px; z-index: 60; max-width: min(430px, calc(100vw - 32px)); padding: 18px 20px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .cookie[hidden] { display: none; }
    .cookie p { margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
    .cookie a { color: inherit; text-underline-offset: 2px; }
    .cookie .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .cookie button { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); }
    .cookie .yes { background: var(--bubble); color: var(--bubble-ink); border-color: var(--bubble); }
    .cookie .no { background: var(--surface-2); color: var(--ink); font-weight: 500; }
    .cookie button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* ---------- warm, app-style look: big greeting, rounded composer card, pill nav ---------- */
    @media (prefers-color-scheme: light) { .side { background: #f7f5f1; } }
    .new { background: var(--surface-2); border-color: transparent; border-radius: 10px; }
    .item { border-radius: 8px; }
    .item[aria-current="true"] { box-shadow: none; background: var(--surface-2); }
    .empty { text-align: center; padding: clamp(32px, 14vh, 140px) 0 24px; }
    .empty .hero-mark { margin-left: auto; margin-right: auto; }
    .empty h2 { font: 700 clamp(34px, 5.6vw, 56px)/1.08 var(--sans); letter-spacing: -.025em; }
    .empty h2::after { content: "."; color: var(--accent); }
    .empty > p { margin-left: auto; margin-right: auto; }
    .starts { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
    .start { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px 12px 10px; }
    .start:hover { border-color: var(--ink-3); background: var(--surface); }
    .box { border-radius: 14px; box-shadow: 0 1px 2px rgba(22,21,19,.05); background: var(--surface); padding: 10px 10px 10px 18px; }
    .box:focus-within { border-color: var(--ink-3); }
    .send { border-radius: 10px; background: var(--accent); }
    .send:disabled { background: var(--line); color: var(--ink-3); }
    .human, .lang, .speak { border-radius: 10px; }
    .cookie { left: auto; right: 16px; border-radius: 12px; }
    .cookie .yes { border-radius: 8px; }
    .cookie .no { border-radius: 8px; background: var(--surface); }
    .cta, .btn { border-radius: 10px; }
    .linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Chats">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="st" d="M5 4C3 12 7 20 5 28"/><path class="st" d="M10.5 3C8.5 11 12.5 21 10.5 29"/><path class="st" d="M16 3C14 12 18 20 16 29"/><path class="st" d="M21.5 3C19.5 11 23.5 21 21.5 29"/><path class="st" d="M27 4C25 12 29 20 27 28"/></svg></span>
        <span>Faiyke</span>
      </div>
      <button class="new" id="new" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-t="newChat"></span>
      </button>
      <nav class="hist" aria-label="Chat history">
        <p class="hist-h" data-t="recent"></p>
        <ul id="hist"></ul>
        <button class="wipe" id="wipe" type="button" hidden></button>
      </nav>
      <div class="reach">
        <b data-t="reachTitle"></b>

      starts: [
        ["hair", "Echthaar-Store", "Welche Bundle-Länge und Menge brauche ich für einen vollen Look?"],

  };

  /* Cookie choice. "Continue" lets this page remember chats, language and voice settings in this browser;
     "Reject" (or no answer yet) keeps all of that in memory only, until the tab is closed. */
  var CHOICE = "faiyke_cookie_choice", OPTIONAL = ["faiyke_chats_v1", "faiyke_lang", "faiyke_voice_ok", "faiyke_autoread"];
  var choice = "";
  try { choice = localStorage.getItem(CHOICE) || ""; } catch (e) {}
  if (choice !== "all" && choice !== "essential") choice = "";
  function mayStore() { return choice === "all"; }
  function getStored(k) { if (!mayStore()) return null; try { return localStorage.getItem(k); } catch (e) { return null; } }
  function putStored(k, v) { if (mayStore()) { try { localStorage.setItem(k, v); } catch (e) {} } }
  function dropOptional() { try { OPTIONAL.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }

  var STORE = "faiyke_chats_v1", LANG = "faiyke_lang";
  var MAX = 1000;
  var lang = "en";
  lang = getStored(LANG) || "";
  if (lang !== "en" && lang !== "de") lang = (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en";

  var chats = [], activeId = null, busy = false;
  try { chats = JSON.parse(getStored(STORE) || "[]"); } catch (e) { chats = []; }
  if (!Array.isArray(chats)) chats = [];

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), stage = $("stage"), scroller = $("scroll"), input = $("input"),
      sendBtn = $("send"), form = $("form"), histEl = $("hist");

  function t(k) { return T[lang][k]; }
  function save() {
    chats = chats.slice(0, 40);
    putStored(STORE, JSON.stringify(chats));
  }
  function active() { for (var i = 0; i < chats.length; i++) if (chats[i].id === activeId) return chats[i]; return null; }
  function uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g, ""); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- the mark: five strands, one per service line ---------- */
  var NS = "http://www.w3.org/2000/svg";
  var STRANDS = ["M5 4C3 12 7 20 5 28", "M10.5 3C8.5 11 12.5 21 10.5 29", "M16 3C14 12 18 20 16 29", "M21.5 3C19.5 11 23.5 21 21.5 29", "M27 4C25 12 29 20 27 28"];
  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function markEl(cls) {  // the avatar; with the class "loader" the strands sway while the assistant is working
    var m = el("span", cls || "mark");
    m.setAttribute("aria-hidden", "true");
    var s = svgEl("svg", { viewBox: "0 0 32 32" });
    STRANDS.forEach(function (d) { s.appendChild(svgEl("path", { "class": "st", d: d })); });
    m.appendChild(s);
    return m;
  }
  function strandEl() {  // a single curved strand beside a starter question, in that service line's colour
    var s = svgEl("svg", { "class": "strand", viewBox: "0 0 10 40", preserveAspectRatio: "none", "aria-hidden": "true" });
    s.appendChild(svgEl("path", { d: "M5 2C2 14 8 26 5 38" }));
    return s;
  }
  function statusEl(text) {  // what the assistant is doing, in plain words, before the answer starts to appear
    var w = el("div", "work", text);
    w.setAttribute("role", "status");
    return w;
  }
  function checkingText(list) {
    if (!list.length) return t("thinking");
    var a = list[0].title;
    if (list.length === 1) return t("checking") + " " + a + "…";
    if (list.length === 2) return t("checking") + " " + a + " " + t("and") + " " + list[1].title + "…";
    return t("checking") + " " + a + " " + t("and") + " " + (list.length - 1) + " " + t("more") + "…";
  }
  /* Which parts of our information an answer used. The server sends titles only; they are checked again here and
     shown as plain text. */
  var LINE_KEYS = { hair: 1, ai: 1, web: 1, it: 1, crm: 1, general: 1 };
  function cleanSources(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (s) {
      return s && typeof s.title === "string" && s.title.length > 0 && s.title.length <= 60 && LINE_KEYS[s.line] === 1;
    }).slice(0, 3).map(function (s) { return { line: s.line, title: s.title }; });
  }
  function sourcesList(list) {
    if (!list || !list.length) return null;
    var ul = el("ul", "sources");
    ul.setAttribute("aria-label", t("basedOn"));
    ul.appendChild(el("li", "lead", t("basedOn")));
    list.forEach(function (s) {
      var li = el("li", "src", s.title);
      li.style.setProperty("--c", "var(--" + s.line + ")");
      ul.appendChild(li);
    });
    return ul;
  }
  function unsureBox() {  // "not sure" is its own state, and always has a way forward
    var box = el("div", "unsure");
    box.appendChild(el("p", "", t("unsure")));
    var b = el("button", "btn quiet", t("human"));
    b.type = "button";
    b.addEventListener("click", function () { submit(t("humanMsg")); });
    box.appendChild(b);
    return box;
  }

  /* Follow the text while the reader is at the bottom; if they scroll up to re-read, leave them there and offer a way back. */
  var stick = true, lastTop = 0, jumpBtn = null;
  function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }
  // Our own scrolling is recognised by position (where we put it), not by a timer: while text streams we scroll every
  // frame, so a timer would swallow the reader's own scroll and pull them back down.
  function toBottom() { scroller.scrollTop = scroller.scrollHeight; lastTop = scroller.scrollTop; }

  /* ---------- which web addresses may be clickable ---------- */
  var LINK_HOSTS = ["faiyke.com"];  // plus the booking and privacy hosts the server reports (see loadConfig)
  function addLinkHost(u) {
    try { var h = new URL(u).hostname.toLowerCase(); if (h && LINK_HOSTS.indexOf(h) < 0) LINK_HOSTS.push(h); } catch (e) {}
  }
  function linkOk(u) {
    var h;
    try { h = new URL(u.replace(/&amp;/g, "&")).hostname.toLowerCase(); } catch (e) { return false; }  // the real host: "faiyke.com@evil.example" is evil.example
    return LINK_HOSTS.some(function (d) { return h === d || h.slice(-(d.length + 1)) === "." + d; });
  }

  /* ---------- small, safe markdown ---------- */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // Only our own addresses become links (the server removes the others from the final answer; this covers the
    // text shown while it is still streaming). Anything else stays plain, unclickable text.
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, function (m, pre, url) {
      return linkOk(url) ? pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' : pre + url;
    });
    s = s.replace(/(^|[\s(])([\w.+-]+@[\w-]+\.[\w.-]*\w)/g, '$1<a href="mailto:$2">$2</a>');
    return s;
  }
  function md(text) {
    return text.replace(/\r/g, "").split(/\n{2,}/).map(function (block) {
      var lines = block.split("\n").filter(function (l) { return l.trim() !== ""; });
      if (!lines.length) return "";
      if (lines.every(function (l) { return /^\s*[-*•]\s+/.test(l); }))
        return "<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>"; }).join("") + "</ul>";
      if (lines.every(function (l) { return /^\s*\d+[.)]\s+/.test(l); }))
        return "<ol>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; }).join("") + "</ol>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }

  /* ---------- static text ---------- */
  function applyLang() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (n) { n.textContent = t(n.getAttribute("data-t")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-t-label]"), function (n) { n.setAttribute("aria-label", t(n.getAttribute("data-t-label"))); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    stopSpeak(); stopMic();
    updateVoiceUI();
    renderFoot();
    renderHistory();
    renderStage();
  }
  function renderFoot() {
    var f = $("foot");
    f.textContent = "";
    if (flashMsg) { f.appendChild(el("span", flashErr ? "count" : "", flashMsg)); return; }
    var len = input.value.length;
    if (len > MAX - 150) {
      var c = el("span", "count", (MAX - len) + t("left"));
      f.appendChild(c);
      return;
    }
    f.appendChild(document.createTextNode(t("note") + " " + t("stored")));
  }

  /* ---------- history ---------- */
  function renderHistory() {
    histEl.textContent = "";
    $("wipe").hidden = !chats.length;
    if (!wipeArmed) $("wipe").textContent = t("wipe");
    if (!chats.length) { var li0 = el("li"); li0.appendChild(el("p", "none", t("none"))); histEl.appendChild(li0); return; }
    chats.forEach(function (c) {
      var li = el("li", "item");
      if (c.id === activeId) li.setAttribute("aria-current", "true");
      var open = el("button", "open", c.title || t("untitled"));
      open.type = "button";
      open.addEventListener("click", function () { select(c.id); });
      var del = el("button", "del");
      del.type = "button";
      del.setAttribute("aria-label", t("del") + ": " + (c.title || t("untitled")));
      del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener("click", function () { remove(c.id); });
      li.appendChild(open); li.appendChild(del);
      histEl.appendChild(li);
    });
  }
  function select(id) { if (busy) return; activeId = id; closeDrawer(); renderHistory(); renderStage(); input.focus(); }
  /* Erasure: ask the server to drop its copy (conversation and ratings), then remove ours. */
  function forgetOnServer(sid) {
    if (!sid) return;
    try {
      fetch("/api/forget", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sid })
      }).catch(function () {});
    } catch (e) {}
  }
  var wipeArmed = false, wipeTimer = null;
  function disarmWipe() { wipeArmed = false; clearTimeout(wipeTimer); var w = $("wipe"); w.classList.remove("sure"); w.textContent = t("wipe"); }
  $("wipe").addEventListener("click", function () {
    if (busy) return;
    if (!wipeArmed) {  // two clicks, so a stray click cannot delete everything
      wipeArmed = true; this.classList.add("sure"); this.textContent = t("wipeSure");
      wipeTimer = setTimeout(disarmWipe, 4000);
      return;
    }
    chats.forEach(function (c) { forgetOnServer(c.sid); });
    chats = []; activeId = null; stopSpeak();
    try { localStorage.removeItem(STORE); localStorage.removeItem("faiyke_voice_ok"); localStorage.removeItem("faiyke_autoread"); } catch (e) {}
    autoRead = false; updateVoiceUI();
    disarmWipe(); renderHistory(); renderStage(); closeDrawer();
  });

  function remove(id) {
    var gone = chats.filter(function (c) { return c.id === id; })[0];
    if (gone) forgetOnServer(gone.sid);
    chats = chats.filter(function (c) { return c.id !== id; });
    if (activeId === id) activeId = null;
    save(); renderHistory(); renderStage();
  }
  function newChat() { if (busy) return; activeId = null; closeDrawer(); renderHistory(); renderStage(); input.focus(); }

  /* ---------- stage ---------- */
  function botRow(text, isErr) {
    var row = el("div", "msg bot" + (isErr ? " err" : ""));
    row.appendChild(markEl());
    var body = el("div", "body");
    body.innerHTML = md(text);
    row.appendChild(body);
    return row;
  }
  /* Follow-up questions under the latest answer. The server has already checked them; they are checked again here
     and only ever shown as plain text. A click sends the text like anything the customer types. */
  function cleanNext(list) {
    if (!Array.isArray(list)) return [];
    return list.filter(function (s) { return typeof s === "string" && s.length >= 3 && s.length <= 90; }).slice(0, 3);
  }
  function chipsBox(list) {
    var items = cleanNext(list);
    if (!items.length) return null;
    var box = el("div", "chips");
    box.setAttribute("role", "group"); box.setAttribute("aria-label", t("suggested"));
    items.forEach(function (s) {
      var b = el("button", "chip", s);
      b.type = "button";
      b.addEventListener("click", function () { submit(s); });
      box.appendChild(b);
    });
    return box;
  }

  /* Booking link: comes only from the server's settings, and is re-checked here (https only). */
  var bookingUrl = "";
  function bookLink() {
    var a = el("a", "cta", t("bookCall"));
    a.href = bookingUrl; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function setBooking(u) {
    bookingUrl = (typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u)) ? u : "";
    var side = $("book");
    if (bookingUrl) side.href = bookingUrl;
    side.hidden = !bookingUrl;
    renderStage();
  }
  function setPrivacy(u) {
    var ok = typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u);
    var a = $("privacyLink");
    if (ok) a.href = u;
    a.hidden = !ok;
  }
  function loadConfig() {
    fetch("/api/config").then(function (r) { return r.json(); })
      .then(function (d) {
        addLinkHost(d && d.privacy_url); addLinkHost(d && d.booking_url);
        setPrivacy(d && d.privacy_url); setBooking(d && d.booking_url);
      }).catch(function () {});
  }

  var THUMB = {
    up: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4v-9h3zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-1.5 7A2 2 0 0 1 17.5 20H7"/></svg>',
    down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 13V4h3v9h-3zM17 13l-4 8a2 2 0 0 1-2-2v-4H5a2 2 0 0 1-2-2l1.5-7A2 2 0 0 1 6.5 4H17"/></svg>'
  };
  function sendFeedback(c, m, rating, comment) {
    var body = { session_id: c.sid, fid: m.fid, rating: rating };
    if (comment) body.comment = comment;
    return fetch("/api/feedback", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).catch(function () {});
  }
  function rateButton(c, m, rating, bar) {
    var b = el("button", "rate");
    b.type = "button"; b.innerHTML = THUMB[rating];
    b.setAttribute("aria-label", t(rating === "up" ? "good" : "bad"));
    b.title = t(rating === "up" ? "good" : "bad");
    b.setAttribute("aria-pressed", m.vote === rating ? "true" : "false");
    b.addEventListener("click", function () {
      if (m.vote === rating) return;
      m.vote = rating; m.commented = false; save();
      sendFeedback(c, m, rating);
      renderStage();
    });
    return b;
  }
  function commentBox(c, m) {
    var wrap = el("div", "why");
    var reasons = el("div", "reasons");
    reasons.setAttribute("role", "group"); reasons.setAttribute("aria-label", t("bad"));
    (t("reasons") || []).forEach(function (r) {
      var chip = el("button", "chip", r);
      chip.type = "button";
      chip.addEventListener("click", function () {  // one tap is enough: the reason is the feedback
        m.commented = true; save();
        sendFeedback(c, m, "down", r);
        renderStage();
      });
      reasons.appendChild(chip);
    });
    var f = el("form");
    var inp = el("input"); inp.type = "text"; inp.maxLength = 300; inp.placeholder = t("whyPh");
    inp.setAttribute("aria-label", t("whyPh"));
    var go = el("button", "", t("whySend")); go.type = "submit";
    f.appendChild(inp); f.appendChild(go);
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      m.commented = true; save();
      if (v) sendFeedback(c, m, "down", v);
      renderStage();
    });
    wrap.appendChild(reasons); wrap.appendChild(f);
    return wrap;
  }
  function tools(m, c, retry) {
    var text = m.t;
    var bar = el("div", "tools");
    var copy = el("button", "", t("copy"));
    copy.type = "button";
    copy.addEventListener("click", function () {
      try {
        navigator.clipboard.writeText(text).then(function () {
          copy.textContent = t("copied");
          setTimeout(function () { copy.textContent = t("copy"); }, 1400);
        });
      } catch (e) {}
    });
    bar.appendChild(copy);
    if (synth) {
      var ls = el("button", "listen", speakingText === text ? t("stop") : t("listen"));
      ls.type = "button";
      ls._txt = text;
      ls.addEventListener("click", function () { if (speakingText === text) stopSpeak(); else speak(text); });
      bar.appendChild(ls);
    }
    if (retry) {
      var r = el("button", "", t("retry"));
      r.type = "button";
      r.addEventListener("click", retry);
      bar.appendChild(r);
    }
    if (m.fid && c.sid && !m.err) {
      bar.appendChild(rateButton(c, m, "up"));
      bar.appendChild(rateButton(c, m, "down"));
      if (m.vote) bar.appendChild(el("span", "thanks", t("thanks")));
    }
    return bar;
  }
  function renderStage() {
    stage.textContent = "";
    $("title").textContent = (active() && active().title) || t("title");
    var c = active();
    if (!c || !c.msgs.length) {
      var box = el("section", "empty");
      box.appendChild(markEl("mark hero-mark"));
      box.appendChild(el("h2", "", t("greet")));
      box.appendChild(el("p", "", t("lead")));
      var ul = el("ul", "starts");
      t("starts").forEach(function (s) {
        var li = el("li");
        var b = el("button", "start");
        b.type = "button";
        b.style.setProperty("--c", "var(--" + s[0] + ")");
        b.appendChild(strandEl());
        var wrap = el("div");
        wrap.appendChild(el("strong", "", s[1]));
        wrap.appendChild(el("span", "", s[2]));
        b.appendChild(wrap);
        b.addEventListener("click", function () { submit(s[2]); });
        li.appendChild(b); ul.appendChild(li);
      });
      box.appendChild(ul);
      stage.appendChild(box);
      scroller.scrollTop = 0;
      return;
    }
    var thread = el("div", "thread");
    c.msgs.forEach(function (m, i) {
      if (m.r === "me") {
        var row = el("div", "msg me");
        row.appendChild(el("div", "body", m.t));
        thread.appendChild(row);
      } else {
        var r = botRow(m.t, m.err);
        var last = i === c.msgs.length - 1;
        var srcs = (m.err || m.unsure) ? null : sourcesList(cleanSources(m.src));  // "I don't have that detail" is not based on anything
        if (srcs) r.appendChild(srcs);
        if (m.unsure && last && !busy && !m.err) r.appendChild(unsureBox());
        if (m.book && bookingUrl) r.appendChild(bookLink());
        r.appendChild(tools(m, c, m.err && last ? retryLast : null));
        if (m.vote === "down" && !m.commented && m.fid) r.appendChild(commentBox(c, m));
        var rating = m.vote === "down" && !m.commented && m.fid;  // while the reasons are open, no follow-up chips next to them
        if (last && !busy && !m.err && !rating) { var chips = chipsBox(m.next); if (chips) r.appendChild(chips); }
        r.style.animation = "none";
        thread.appendChild(r);
      }
    });
    stage.appendChild(thread);
    stick = true; toBottom();
  }

  /* ---------- sending ---------- */
  function setBusy(v) { busy = v; updateSend(); }

  function submit(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    var c = active();
    if (!c) {
      c = { id: uid(), sid: null, title: text.length > 42 ? text.slice(0, 40) + "…" : text, msgs: [] };
      chats.unshift(c); activeId = c.id;
    }
    stopSpeak(); stopMic(); flashMsg = "";
    c.msgs.push({ r: "me", t: text });
    save();
    input.value = ""; grow(); renderFoot();
    renderHistory(); renderStage();
    ask(c, text);
  }

  function retryLast() {
    var c = active();
    if (!c || busy) return;
    var last = c.msgs[c.msgs.length - 1];
    if (!last || !last.err) return;
    c.msgs.pop();
    var q = c.msgs[c.msgs.length - 1];
    if (!q || q.r !== "me") return;
    save(); renderStage();
    ask(c, q.t);
  }

  /* The answer arrives piece by piece (/api/chat/stream). Browsers without streaming use /api/chat. */
  var CAN_STREAM = !!(window.fetch && window.ReadableStream && window.TextDecoder);
  var SEND_SVG = sendBtn.innerHTML;
  var STOP_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  var stopFn = null;  // set while an answer is streaming: lets the send button act as a Stop button

  function updateSend() {
    $("human").disabled = busy;
    if (busy && stopFn) {
      sendBtn.disabled = false; sendBtn.type = "button"; sendBtn.innerHTML = STOP_SVG; sendBtn.setAttribute("aria-label", t("stop"));
    } else {
      sendBtn.type = "submit"; sendBtn.innerHTML = SEND_SVG; sendBtn.setAttribute("aria-label", t("send"));
      sendBtn.disabled = busy || !input.value.trim();
    }
  }
  sendBtn.addEventListener("click", function () { if (busy && stopFn) stopFn(); });

  function plainAsk(c, text) {
    return fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: c.sid, message: text })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
  }

  function streamAsk(c, text, onText, onReset, signal, onSources) {
    return fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: signal,
      body: JSON.stringify({ session_id: c.sid, message: text })
    }).then(function (r) {
      var type = r.headers.get("Content-Type") || "";
      if (type.indexOf("text/event-stream") !== 0 || !r.body) {  // an error from the server comes as plain JSON
        return r.json().then(function (d) { return { ok: r.ok, d: d }; });
      }
      var reader = r.body.getReader(), dec = new TextDecoder("utf-8"), buf = "", result = null;
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return result || { ok: false, d: {} };  // ended without a final result: treat as a failure
          buf += dec.decode(chunk.value, { stream: true });
          if (buf.length > 1000000) { reader.cancel(); return { ok: false, d: {} }; }
          var parts = buf.split("\n\n"); buf = parts.pop();
          parts.forEach(function (p) {
            if (p.indexOf("data: ") !== 0) return;
            var ev; try { ev = JSON.parse(p.slice(6)); } catch (e) { return; }
            if (typeof ev.session_id === "string") c.sid = ev.session_id;
            if (typeof ev.t === "string") onText(ev.t);
            else if (Array.isArray(ev.src)) { if (onSources) onSources(cleanSources(ev.src)); }
            else if (ev.reset) onReset();
            else if (ev.done && typeof ev.done === "object") result = { ok: true, d: ev.done };
          });
          return pump();
        });
      }
      return pump();
    });
  }

  function ask(c, text) {
    setBusy(true);
    var thread = stage.querySelector(".thread");
    var wait = el("div", "msg bot");
    wait.appendChild(markEl("mark loader"));  // the strands sway for as long as the assistant is working
    var body = el("div", "body");
    body.appendChild(statusEl(t("thinking")));
    wait.appendChild(body);
    thread.appendChild(wait);
    stick = true; toBottom();
    stage.setAttribute("aria-busy", "true");  // screen readers wait for the finished answer instead of reading every piece

    var acc = "", frame = 0, ctl = null;
    function paint() {  // at most once per frame, however fast the pieces arrive
      frame = 0;
      if (acc) body.innerHTML = md(acc);  // md() escapes everything first, so streamed text can never become markup
      if (stick) toBottom();
    }
    function onText(piece) { acc += piece; if (!frame) frame = requestAnimationFrame(paint); }
    function onReset() { acc = ""; body.textContent = ""; body.appendChild(statusEl(t("thinking"))); }
    function onSources(list) {  // before the answer starts: say what is being read, in the customer's terms
      if (!acc) { body.textContent = ""; body.appendChild(statusEl(checkingText(list))); }
    }

    var job;
    if (CAN_STREAM) {
      ctl = window.AbortController ? new AbortController() : null;
      if (ctl) { stopFn = function () { ctl.abort(); }; updateSend(); }
      job = streamAsk(c, text, onText, onReset, ctl && ctl.signal, onSources);
    } else {
      job = plainAsk(c, text);
    }
    job.then(function (res) {
      if (res.d.session_id) c.sid = res.d.session_id;
      var reply = res.d.reply || (res.ok ? "" : res.d.error) || t("fail");
      c.msgs.push({ r: "bot", t: reply, err: !res.d.reply, fid: /^[0-9a-f]{16}$/.test(res.d.fid || "") ? res.d.fid : "", book: res.d.book === true, next: cleanNext(res.d.next),
                    src: cleanSources(res.d.sources), unsure: res.d.unsure === true });
    }).catch(function () {
      if (ctl && ctl.signal.aborted) {  // the customer pressed Stop: keep what had arrived
        c.msgs.push({ r: "bot", t: acc.trim() || t("stopped"), err: false });
      } else {
        c.msgs.push({ r: "bot", t: t("offline"), err: true });
      }
    }).then(function () {
      if (frame) cancelAnimationFrame(frame);
      stopFn = null; stage.removeAttribute("aria-busy");
      save(); setBusy(false);
      if (activeId === c.id) {
        renderStage();
        var lastMsg = c.msgs[c.msgs.length - 1];
        if (autoRead && lastMsg && lastMsg.r === "bot" && !lastMsg.err && lastMsg.fid) speak(lastMsg.t);
      }
      input.focus();
    });
  }

  /* ---------- voice: output (speechSynthesis) and input (SpeechRecognition) ---------- */
  var synth = window.speechSynthesis || null;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var autoRead = false;
  autoRead = getStored("faiyke_autoread") === "1";
  var speakingText = "", speakToken = 0;
  var rec = null, listening = false, flashMsg = "", flashErr = false;
  var micBtn = $("mic"), speakBtn = $("speak");

  function locale() { return lang === "de" ? "de-DE" : "en-US"; }
  function plain(s) {
    return s.replace(/https?:\/\/\S+/g, "").replace(/[*`#]/g, "").replace(/^\s*[-•]\s+/gm, "").replace(/^\s*(\d+)[.)]\s+/gm, "$1. ");
  }
  function chunks(s) {
    var parts = s.split(/(?<=[.!?:])\s+|\n+/), out = [], cur = "";
    parts.forEach(function (p) {
      if (!p.trim()) return;
      if ((cur + " " + p).length > 180 && cur) { out.push(cur); cur = p; } else cur = cur ? cur + " " + p : p;
    });
    if (cur) out.push(cur);
    return out;
  }
  function syncListen() {
    Array.prototype.forEach.call(document.querySelectorAll(".listen"), function (b) {
      b.textContent = b._txt === speakingText ? t("stop") : t("listen");
    });
  }
  function stopSpeak() {
    speakToken++; speakingText = "";
    if (synth) synth.cancel();
    syncListen();
  }
  function speak(text) {
    if (!synth) return;
    stopSpeak();
    var token = speakToken, queue = chunks(plain(text));
    if (!queue.length) return;
    speakingText = text; syncListen();
    var voice = null, vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang && vs[i].lang.toLowerCase().indexOf(lang) === 0) { voice = vs[i]; if (!vs[i].localService) continue; break; }
    }
    (function next() {
      if (token !== speakToken) return;
      var part = queue.shift();
      if (!part) { speakingText = ""; syncListen(); return; }
      var u = new SpeechSynthesisUtterance(part);
      u.lang = locale(); if (voice) u.voice = voice;
      u.onend = next;
      u.onerror = function () { if (token === speakToken) { speakingText = ""; syncListen(); } };
      synth.speak(u);
    })();
  }

  function flash(msg, isErr) { flashMsg = msg; flashErr = !!isErr; renderFoot(); }
  function updateVoiceUI() {
    input.placeholder = listening ? t("listening") : t("placeholder");
    micBtn.hidden = !SR;
    micBtn.setAttribute("aria-pressed", listening ? "true" : "false");
    micBtn.setAttribute("aria-label", listening ? t("micStop") : t("mic"));
    micBtn.title = micBtn.getAttribute("aria-label");
    speakBtn.hidden = !synth;
    speakBtn.setAttribute("aria-pressed", autoRead ? "true" : "false");
    speakBtn.setAttribute("aria-label", t("autoRead"));
    speakBtn.title = t("autoRead");
  }
  function stopMic() {
    if (rec) { try { rec.abort(); } catch (e) {} }
    rec = null; listening = false; flashMsg = "";
    updateVoiceUI();
  }
  function startMic() {
    if (!SR || busy) return;
    stopSpeak();
    var base = input.value ? input.value.replace(/\s+$/, "") + " " : "";
    var r = new SR();
    r.lang = locale(); r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    r.onresult = function (e) {
      var s = "";
      for (var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
      input.value = (base + s).slice(0, MAX);
      grow();
    };
    r.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") flash(t("micDenied"), true);
      else if (e.error !== "no-speech" && e.error !== "aborted") flash(t("micFail"), true);
    };
    r.onend = function () {
      if (rec !== r) return;
      rec = null; listening = false; updateVoiceUI();
      if (flashMsg === t("micNote")) { flashMsg = ""; renderFoot(); }
      input.focus();
    };
    rec = r; listening = true;
    try { r.start(); } catch (e) { rec = null; listening = false; flash(t("micFail"), true); }
    updateVoiceUI();
    if (listening) flash(t("micNote"));
  }
  /* Voice input needs a yes first: the audio goes to the browser's speech service (a third party). */
  var consentBox = $("consent"), VOICE_OK = "faiyke_voice_ok", afterConsent = null;
  var voiceYes = false;
  function voiceAllowed() { return voiceYes || getStored(VOICE_OK) === "1"; }
  function hideConsent() { consentBox.hidden = true; afterConsent = null; }
  $("consentYes").addEventListener("click", function () {
    voiceYes = true; putStored(VOICE_OK, "1");
    var go = afterConsent; hideConsent();
    if (go) go();
  });
  $("consentNo").addEventListener("click", function () { hideConsent(); input.focus(); });
  micBtn.addEventListener("click", function () {
    if (listening) { rec.stop(); return; }
    if (voiceAllowed()) { startMic(); return; }
    afterConsent = startMic; consentBox.hidden = false; $("consentYes").focus();
  });
  speakBtn.addEventListener("click", function () {
    autoRead = !autoRead;
    putStored("faiyke_autoread", autoRead ? "1" : "0");
    if (!autoRead) stopSpeak();
    updateVoiceUI();
  });
  if (synth && synth.addEventListener) synth.addEventListener("voiceschanged", function () {});

  /* ---------- composer ---------- */
  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
    updateSend();
  }
  input.addEventListener("input", function () { if (!listening) flashMsg = ""; grow(); renderFoot(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); submit(input.value); });

  /* ---------- chrome ---------- */
  function openDrawer() { app.classList.add("open"); }
  function closeDrawer() { app.classList.remove("open"); }
  $("menu").addEventListener("click", openDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (busy && stopFn) { stopFn(); return; }  // Esc stops a running answer, as the Stop button does
    closeDrawer(); hideConsent();
  });
  $("human").addEventListener("click", function () { submit(t("humanMsg")); });
  jumpBtn = $("jump");
  jumpBtn.addEventListener("click", function () { stick = true; toBottom(); jumpBtn.hidden = true; });
  scroller.addEventListener("scroll", function () {
    if (Math.abs(scroller.scrollTop - lastTop) < 2) return;  // that was us, not the reader
    lastTop = scroller.scrollTop;
    stick = atBottom();
    jumpBtn.hidden = !(busy && !stick);
  });
  $("new").addEventListener("click", newChat);
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      putStored(LANG, lang);
      applyLang();
    });
  });

  /* The banner: shown until a choice is made, and again from "Cookie settings". */
  var cookieBar = $("cookieBar");
  function showCookieBar() { cookieBar.hidden = false; $("cookieYes").focus(); }
  function choose(value) {
    choice = value;
    try { localStorage.setItem(CHOICE, value); } catch (e) {}
    cookieBar.hidden = true;
    if (value === "all") {
      try {  // chats saved earlier on this device come back; the ones from this visit are kept too
        var old = JSON.parse(getStored(STORE) || "[]");
        if (Array.isArray(old)) old.forEach(function (c) { if (c && !chats.some(function (m) { return m.id === c.id; })) chats.push(c); });
      } catch (e) {}
      save(); putStored(LANG, lang); putStored("faiyke_autoread", autoRead ? "1" : "0");
      if (voiceYes) putStored(VOICE_OK, "1");
      renderHistory();
    } else {
      dropOptional();  // nothing optional stays on this device
    }
  }
  $("cookieYes").addEventListener("click", function () { choose("all"); });
  $("cookieNo").addEventListener("click", function () { choose("essential"); });
  $("cookieSettings").addEventListener("click", showCookieBar);
  if (!choice) cookieBar.hidden = false;

  applyLang();
  loadConfig();
  input.focus();
})();
</script>
</body>
</html>
